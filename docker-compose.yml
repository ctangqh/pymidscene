version: '3.8'

services:
  pymidscene-mcp:
    build: .
    image: pymidscene-mcp:latest
    container_name: pymidscene-mcp
    restart: always
    ports:
      - "8765:8765" # MCP HTTP服务端口
    environment:
      # 从宿主机.env文件导入配置
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - MCP_SERVER_URL=${MCP_SERVER_URL}
      - MCP_API_KEY=${MCP_API_KEY}
      - MCP_TIMEOUT=${MCP_TIMEOUT}
      # 浏览器配置
      - BROWSER_HEADLESS=true
      - BROWSER_VIEWPORT_WIDTH=1920
      - BROWSER_VIEWPORT_HEIGHT=1080
    volumes:
      # 挂载输出目录，保存截图、报告等
      - ./output:/app/output
      # 挂载本地源代码方便调试，生产环境可以去掉
      - ./src:/app/src
    networks:
      - pymidscene-network

networks:
  pymidscene-network:
    driver: bridge
