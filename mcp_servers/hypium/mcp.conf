# Hypium MCP Server Configuration

# MCP Server listen address
MCP_HOST=0.0.0.0
MCP_PORT=55002

# Enable verbose MCP logs (true/false)
MCP_LOG_VERBOSE=false

# Python executable used to run helper.py.
# Leave empty to auto-discover from current environment / PATH.
HYPIUM_PYTHON=

# Hypium connector mode, usually hdc.
HYPIUM_CONNECTOR=hdc

# Optional target device serial number.
HYPIUM_DEVICE_SN=

# Optional driver report path on server host.
HYPIUM_REPORT_PATH=

# Hypium driver log level: info/debug
HYPIUM_LOG_LEVEL=info

# Optional remote hdc server address.
HYPIUM_CONNECTOR_HOST=
HYPIUM_CONNECTOR_PORT=0

# Optional temp dir for screenshot and dump artifacts.
HYPIUM_TEMP_DIR=
