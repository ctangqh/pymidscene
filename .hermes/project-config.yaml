project:
  name: pymidscene
  description: test
permission:
  allowed_commands:
    - terminal
    - write_file
    - read_file
    - find
    - grep
    - ls
    - cat
    - python
    - uv
    - pip
  forbidden_commands:
    - rm -rf /
    - dd
  allow_sudo: true
  allowed_paths:
    - /app/tis/pymidscene/**
    - ~/.cache/
    - /tmp/
command:
  timeout: 12000
  default_workdir: /app/tis/pymidscene
  run_as: root
  auto_retry: 3

