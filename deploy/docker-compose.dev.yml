version: '3.8'

services:
  pymidscene-dev:
    build:
      context: ../
      target: dev
    container_name: pymidscene-dev
    volumes:
      - ../:/app  # 挂载本地代码
      - ~/.cache/uv:/root/.cache/uv  # uv缓存
      - ./output:/app/output  # 输出目录
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - DEBUG=1
      - PLAYWRIGHT_HEADLESS=false
    network_mode: host  # 方便本地调试
    shm_size: '2gb'  # 共享内存，避免浏览器崩溃
    restart: unless-stopped
