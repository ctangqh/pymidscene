# YAML 流程示例：百度搜索
name: 百度搜索演示
description: 打开百度，搜索 PyMidscene，提取搜索结果
steps:
  - name: 打开百度首页
    action: goto
    params:
      url: https://www.baidu.com
  
  - name: 输入搜索词
    action: input
    params:
      element: 搜索输入框
      text: PyMidscene AI 浏览器自动化
  
  - name: 点击搜索按钮
    action: click
    params:
      element: 搜索按钮
      
  - name: 等待搜索结果加载
    action: wait
    params:
      timeout: 3000
      
  - name: 截图保存
    action: screenshot
    params:
      save_path: output/search_result.png
      
  - name: 提取搜索结果
    action: extract
    params:
      description: 提取前5条搜索结果的标题和链接，返回格式为[{"title": "xxx", "url": "xxx"}]
    output: search_results

output:
  result: ${search_results}
