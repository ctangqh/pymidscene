[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pymidscene"
version = "0.1.0"
authors = [
  { name="Your Name", email="your.email@example.com" }
]
description = "AI驱动的跨设备自动化测试框架，支持浏览器/移动端/桌面应用"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "loguru>=0.7.0",
  "playwright>=1.40.0",
  "openai>=1.0.0",
  "tenacity>=8.0.0",
  "pytest>=7.0.0",
  "mcp[cli,server]>=1.4.0",
  "aiohttp>=3.9.0",
  "httpx>=0.27.0",
]

#dynamic = ["version"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
